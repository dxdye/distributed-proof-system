# Tool configuration only. The environment is managed by pixi (pixi.toml).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "req(*ids): links a test to system requirements (SR-xx) for the traceability matrix",
    "lean: needs a Lean toolchain (elan); slow on first run",
    "docker: needs a running Docker daemon",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["dpc"]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dpc"]
plugins = ["pydantic.mypy"]
