# Tool configuration only. The environment is managed by pixi (pixi.toml).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "req(*ids): links a test to system requirements (SR-xx) for the traceability matrix",
    "lean: needs a Lean toolchain (elan); slow on first run",
    "docker: needs a running Docker daemon",
    "keycloak: needs the development Keycloak (pixi run keycloak-up)",
    "slow: long-running simulation studies (about a minute)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Greek letters and typographic dashes are deliberate: docstrings and comments
# use the notation of the concept paper (κ, ρ, δ_A, Dawid–Skene, …).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["dpc"]
known-local-folder = ["conftest", "test_coord"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dpc"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
