<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Distributed Proof Check</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the stored colour scheme and font before the first paint (src/theme.ts, src/font.ts).
      try {
        var t = sessionStorage.getItem("dpc.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        if (sessionStorage.getItem("dpc.font") === "mono")
          document.documentElement.setAttribute("data-font", "mono");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
